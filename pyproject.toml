[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "1.0.0"
description = "Telco customer churn: segmentation, model comparison, explainability and a prediction API"
requires-python = ">=3.11"
authors = [{ name = "Hunaiza Khan" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff.lint.per-file-ignores]
# The setup cell must add src/ to sys.path before importing the package.
"notebooks/*" = ["E402"]
