# All tunable values live here — no magic numbers in src/.
seed: 42

data:
  url: https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv
  sha256: 16320c9c1ec72448db59aa0a26a0b95401046bef5d02fd3aeb906448e3055e91
  raw_path: data/raw/telco_churn.csv
  target: Churn
  id_column: customerID
  test_size: 0.2

segmentation:
  features: [tenure, MonthlyCharges, num_services]
  k_min: 2
  k_max: 8

training:
  cv_folds: 5
  selection_metric: roc_auc
  # Business costs used to pick the decision threshold:
  # missing a churner (lost customer) costs more than a retention offer.
  cost_false_negative: 5.0
  cost_false_positive: 1.0

models:
  logistic_regression:
    C: 1.0
    max_iter: 2000
    class_weight: balanced
  svm:
    C: 1.0
    kernel: rbf
    gamma: scale
    class_weight: balanced
  random_forest:
    n_estimators: 400
    max_depth: 10
    min_samples_leaf: 5
    class_weight: balanced
    n_jobs: -1
  lightgbm:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 30
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    class_weight: balanced
    verbose: -1

paths:
  artifacts_dir: artifacts
  results_dir: results
